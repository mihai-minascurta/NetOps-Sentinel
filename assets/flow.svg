<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="NetOps Sentinel: a router goes down and the alert travels through Prometheus, Alertmanager, the incident API and the investigation engine to an AI diagnosis, then to a human who decides" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    :root { --fg:#1f2328; --mut:#6e7781; --line:#d0d7de; --node:#9aa4af; --acc:#c2790c; }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#f0f6fc; --mut:#9198a1; --line:#30363d; --node:#5b636e; --acc:#e8a84f; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title  { font-size: 44px; font-weight: 700; fill: var(--fg); letter-spacing: -0.8px; }
    .tag    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: var(--mut); }
    .status { font-size: 14px; fill: var(--mut); }
    .rule   { stroke: var(--line); stroke-width: 1; }
    .rail   { stroke: var(--line); stroke-width: 2; stroke-linecap: round; }
    .prog   { stroke: var(--acc); stroke-width: 2; stroke-linecap: round; opacity: .85; }
    .base   { fill: var(--node); }
    .lit    { fill: var(--acc); }
    .halo   { fill: var(--acc); opacity: .2; }
    .ring   { fill: none; stroke: var(--acc); stroke-width: 1.5; }
    .name   { font-size: 13px; font-weight: 600; fill: var(--fg); text-anchor: middle; }
    .verb   { font-size: 12px; fill: var(--mut); text-anchor: middle; }
    .br     { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .cap    { font-size: 12px; fill: var(--fg); text-anchor: middle; }
  </style>

  <text class="title" x="48" y="62">NetOps Sentinel</text>
  <text class="tag" x="48" y="92">a network lab that notices when something breaks</text>
  <circle class="lit" cx="52" cy="124" r="4"/>
  <circle class="ring" cx="52" cy="124" r="4">
    <animate attributeName="r" values="4;13" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <text class="status" x="68" y="129">Simulator UI online. Live version coming next.</text>
  <line class="rule" x1="48" y1="156" x2="852" y2="156"/>

  <line class="rail" x1="79.0" y1="224" x2="187.7" y2="224"/>
  <line class="rail" x1="205.7" y1="224" x2="314.3" y2="224"/>
  <line class="rail" x1="332.3" y1="224" x2="441.0" y2="224"/>
  <line class="rail" x1="459.0" y1="224" x2="567.7" y2="224"/>
  <line class="rail" x1="585.7" y1="224" x2="694.3" y2="224"/>
  <line class="rail" x1="712.3" y1="224" x2="821.0" y2="224"/>
  <line class="prog" x1="70.0" y1="224" x2="70.0" y2="224">
    <animate attributeName="x2" values="70.0;70.0;830.0;830.0" keyTimes="0;0.12;0.72;1" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0.85;0" keyTimes="0;0.93;1" dur="11s" repeatCount="indefinite"/>
  </line>
  <circle class="ring" cx="70.0" cy="224" r="6">
    <animate attributeName="r" values="6;6;18;18" keyTimes="0;0.02;0.1;1" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0;0" keyTimes="0;0.02;0.1;1" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle class="base" cx="70.0" cy="224" r="5"/>
  <circle class="lit" cx="70.0" cy="224" r="5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.03;0.06;0.93;1" dur="11s" repeatCount="indefinite"/>
  </circle>
  <text class="name" x="70.0" y="200">Router</text>
  <text class="verb" x="70.0" y="256">goes down</text>
  <circle class="base" cx="196.7" cy="224" r="5"/>
  <circle class="lit" cx="196.7" cy="224" r="5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.22;0.25;0.93;1" dur="11s" repeatCount="indefinite"/>
  </circle>
  <text class="name" x="196.7" y="200">Prometheus</text>
  <text class="verb" x="196.7" y="256">raises alert</text>
  <circle class="base" cx="323.3" cy="224" r="5"/>
  <circle class="lit" cx="323.3" cy="224" r="5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.35;0.93;1" dur="11s" repeatCount="indefinite"/>
  </circle>
  <text class="name" x="323.3" y="200">Alertmanager</text>
  <text class="verb" x="323.3" y="256">sends webhook</text>
  <circle class="base" cx="450.0" cy="224" r="5"/>
  <circle class="lit" cx="450.0" cy="224" r="5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.45;0.93;1" dur="11s" repeatCount="indefinite"/>
  </circle>
  <text class="name" x="450.0" y="200">Incident API</text>
  <text class="verb" x="450.0" y="256">opens incident</text>
  <circle class="base" cx="576.7" cy="224" r="5"/>
  <circle class="lit" cx="576.7" cy="224" r="5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.55;0.93;1" dur="11s" repeatCount="indefinite"/>
  </circle>
  <text class="name" x="576.7" y="200">Engine</text>
  <text class="verb" x="576.7" y="256">gathers evidence</text>
  <circle class="base" cx="703.3" cy="224" r="5"/>
  <circle class="lit" cx="703.3" cy="224" r="5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.65;0.93;1" dur="11s" repeatCount="indefinite"/>
  </circle>
  <text class="name" x="703.3" y="200">AI</text>
  <text class="verb" x="703.3" y="256">suggests a cause</text>
  <circle class="base" cx="830.0" cy="224" r="5"/>
  <circle class="lit" cx="830.0" cy="224" r="5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.75;0.93;1" dur="11s" repeatCount="indefinite"/>
  </circle>
  <text class="name" x="830.0" y="200">You</text>
  <text class="verb" x="830.0" y="256">decide</text>
  <g opacity="0">
    <animateMotion path="M70.0 224 H830.0" dur="11s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.12;0.72;1"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.115;0.125;0.715;0.735;1" dur="11s" repeatCount="indefinite"/>
    <circle class="halo" r="10"/>
    <circle class="lit" r="4"/>
  </g>
  <path class="br" d="M683.3 276 v8 H850.0 v-8"/>
  <text class="cap" x="766.6" y="304">AI only suggests</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>