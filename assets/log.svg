<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 236" width="900" height="236" role="img" aria-label="How an incident unfolds: Prometheus raises an alert, Alertmanager forwards it to the API, the API opens an incident, the engine collects evidence, an AI model suggests a cause and a human decides" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    :root { --fg:#1f2328; --mut:#6e7781; --line:#d0d7de; --edge:#c3cbd3; --acc:#c2790c; --ok:#1a7f37; }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#f0f6fc; --mut:#9198a1; --line:#30363d; --edge:#3d444d; --acc:#e8a84f; --ok:#3fb950; }
    }
    text  { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title  { font-size: 44px; font-weight: 700; fill: var(--fg); letter-spacing: -0.8px; }
    .tag    { font-size: 15px; fill: var(--mut); }
    .status { font-size: 14px; fill: var(--mut); }
    .rule   { stroke: var(--line); stroke-width: 1; }
    .pill   { fill: none; stroke: var(--edge); stroke-width: 1.2; }
    .al     { fill: none; stroke: var(--acc); stroke-width: 1.5; }
    .t      { font-size: 13px; font-weight: 600; fill: var(--fg); text-anchor: middle; }
    .s      { font-size: 10px; fill: var(--mut); text-anchor: middle; }
    .link   { stroke: var(--edge); stroke-width: 2; fill: none; stroke-linecap: round; }
    .fault  { stroke: var(--acc); stroke-width: 2; stroke-dasharray: 4 5; fill: none; stroke-linecap: round; }
    .lit    { stroke: var(--acc); stroke-width: 2; fill: none; stroke-linecap: round; }
    .scr    { stroke: var(--edge); stroke-width: 1.2; stroke-dasharray: 3 4; fill: none; }
    .okdot  { fill: var(--ok); }
    .altdot { fill: var(--acc); }
    .sc     { fill: var(--mut); }
    .ringa  { fill: none; stroke: var(--acc); stroke-width: 1.5; }
    .ringo  { fill: none; stroke: var(--ok); stroke-width: 1.5; }
    .cap    { font-size: 13px; fill: var(--fg); }
    .code   { font-size: 10px; fill: var(--mut); }
    .st     { font-size: 15px; font-weight: 600; fill: var(--fg); }
    .sq     { fill: none; stroke: var(--edge); stroke-width: 1.2; }
    .sqf    { fill: var(--acc); }
    .tagt   { font-size: 12px; fill: var(--mut); }
    .msg    { font-size: 14px; fill: var(--fg); }
    .msgb   { font-size: 14px; font-weight: 600; fill: var(--fg); }
  </style>
  <line class="link" x1="48" y1="34" x2="48" y2="204"/>
  <line class="lit" x1="48" y1="34" x2="48" y2="34">
    <animate attributeName="y2" values="34;34;204;204;34;34" keyTimes="0;0.0455;0.5455;0.8727;0.8736;1" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.8182;0.8727;0.985;1" dur="11s" repeatCount="indefinite"/>
  </line>
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0455;0.0818;0.8182;0.8727;1" dur="11s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="-10,0;-10,0;0,0;0,0" keyTimes="0;0.0455;0.0818;1" dur="11s" repeatCount="indefinite"/>
    <circle class="ringa" cx="48" cy="34" r="4" opacity="0">
      <animate attributeName="r" values="4;4;13;13" keyTimes="0;0.0455;0.1273;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.7;0;0" keyTimes="0;0.0445;0.0455;0.1273;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle class="altdot" cx="48" cy="34" r="4"/>
    <text class="tagt mono" x="70" y="38">prometheus</text>
    <text class="msg" x="190" y="39">R1 stops answering, so an alert is raised</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1455;0.1818;0.8182;0.8727;1" dur="11s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="-10,0;-10,0;0,0;0,0" keyTimes="0;0.1455;0.1818;1" dur="11s" repeatCount="indefinite"/>
    <circle class="ringa" cx="48" cy="68" r="4" opacity="0">
      <animate attributeName="r" values="4;4;13;13" keyTimes="0;0.1455;0.2273;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.7;0;0" keyTimes="0;0.1445;0.1455;0.2273;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle class="altdot" cx="48" cy="68" r="4"/>
    <text class="tagt mono" x="70" y="72">alertmanager</text>
    <text class="msg" x="190" y="73">forwards the alert to the API through a webhook</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2455;0.2818;0.8182;0.8727;1" dur="11s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="-10,0;-10,0;0,0;0,0" keyTimes="0;0.2455;0.2818;1" dur="11s" repeatCount="indefinite"/>
    <circle class="ringa" cx="48" cy="102" r="4" opacity="0">
      <animate attributeName="r" values="4;4;13;13" keyTimes="0;0.2455;0.3273;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.7;0;0" keyTimes="0;0.2445;0.2455;0.3273;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle class="altdot" cx="48" cy="102" r="4"/>
    <text class="tagt mono" x="70" y="106">api</text>
    <text class="msg" x="190" y="107">opens an incident and tracks it until it is closed</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3455;0.3818;0.8182;0.8727;1" dur="11s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="-10,0;-10,0;0,0;0,0" keyTimes="0;0.3455;0.3818;1" dur="11s" repeatCount="indefinite"/>
    <circle class="ringa" cx="48" cy="136" r="4" opacity="0">
      <animate attributeName="r" values="4;4;13;13" keyTimes="0;0.3455;0.4273;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.7;0;0" keyTimes="0;0.3445;0.3455;0.4273;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle class="altdot" cx="48" cy="136" r="4"/>
    <text class="tagt mono" x="70" y="140">engine</text>
    <text class="msg" x="190" y="141">asks Prometheus about status, CPU, RAM, disk and network</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4455;0.4818;0.8182;0.8727;1" dur="11s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="-10,0;-10,0;0,0;0,0" keyTimes="0;0.4455;0.4818;1" dur="11s" repeatCount="indefinite"/>
    <circle class="ringa" cx="48" cy="170" r="4" opacity="0">
      <animate attributeName="r" values="4;4;13;13" keyTimes="0;0.4455;0.5273;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.7;0;0" keyTimes="0;0.4445;0.4455;0.5273;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle class="altdot" cx="48" cy="170" r="4"/>
    <text class="tagt mono" x="70" y="174">ai</text>
    <text class="msg" x="190" y="175">reads that evidence and suggests a likely cause</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5455;0.5818;0.8182;0.8727;1" dur="11s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="-10,0;-10,0;0,0;0,0" keyTimes="0;0.5455;0.5818;1" dur="11s" repeatCount="indefinite"/>
    <circle class="ringo" cx="48" cy="204" r="4" opacity="0">
      <animate attributeName="r" values="4;4;13;13" keyTimes="0;0.5455;0.6273;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.7;0;0" keyTimes="0;0.5445;0.5455;0.6273;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle class="okdot" cx="48" cy="204" r="4"/>
    <text class="tagt mono" x="70" y="208">you</text>
    <text class="msgb" x="190" y="209">decide what to do. The AI changes nothing</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>