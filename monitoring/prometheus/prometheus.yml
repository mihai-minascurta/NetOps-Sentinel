global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "netops-routers"
    static_configs:
      - targets: ["192.168.122.247:9100"]
        labels:
          router: R1

      - targets: ["192.168.122.195:9100"]
        labels:
          router: R2

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']